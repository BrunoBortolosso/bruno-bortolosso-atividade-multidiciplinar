<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login - Bruno Bortolosso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-container" id="login-container">
            <h2>🔐 Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">📧 Email</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">🔑 Senha</label>
                    <input type="password" id="login-password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <p class="toggle-form">
                    Não tem uma conta? <a href="#" id="show-register">Cadastre-se</a>
                </p>
            </form>
            <div id="login-message" class="message"></div>
        </div>

        <div class="form-container hidden" id="register-container">
            <h2>📝 Cadastro</h2>
            <form id="register-form">
                <div class="input-group">
                    <label for="register-name">👤 Nome Completo</label>
                    <input type="text" id="register-name" placeholder="Seu nome completo" required>
                </div>
                <div class="input-group">
                    <label for="register-email">📧 Email</label>
                    <input type="email" id="register-email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="register-password">🔑 Senha</label>
                    <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="register-confirm-password">🔑 Confirmar Senha</label>
                    <input type="password" id="register-confirm-password" placeholder="Digite a senha novamente" required>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <p class="toggle-form">
                    Já tem uma conta? <a href="#" id="show-login">Faça login</a>
                </p>
            </form>
            <div id="register-message" class="message"></div>
        </div>
    </div>

    <script src="src/auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
